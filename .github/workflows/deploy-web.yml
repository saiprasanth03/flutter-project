name: Deploy Flutter Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out project
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Flutter platform scaffolding
        run: flutter create . --platforms=android,ios,linux,macos,web,windows

      - name: Get dependencies
        run: flutter pub get

      - name: Commit generated platform files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- android ios linux macos web .metadata .gitignore analysis_options.yaml
          if ! git diff --cached --quiet; then
            git commit -m "Add Flutter platform scaffolding [skip ci]"
            git push origin HEAD:main
          fi

      - name: Build for GitHub Pages
        run: flutter build web --release --base-href /flutter-project/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
